name: Monitor UN Updates

on:
  schedule:
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "monitor"
        type: choice
        options:
          - monitor
          - test_telegram

permissions:
  contents: write

concurrency:
  group: international-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Monitor
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="${WORKFLOW_MODE:-monitor}"
          if [ "$MODE" = "test_telegram" ]; then
            python -m src.main --test-telegram
          else
            python -m src.main
          fi

      - name: Commit State Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update monitored UN items"
          git push
