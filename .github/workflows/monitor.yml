name: Monitor UN Updates

on:
  schedule:
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "monitor"
        type: choice
        options:
          - monitor
          - backfill
          - dry_run
          - test_slack

permissions:
  contents: write

concurrency:
  group: international-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install UN Browser Runtime
        if: ${{ github.event.inputs.mode != 'test_slack' }}
        run: python -m playwright install --with-deps --no-shell chromium

      - name: Run Regression Tests
        run: python -m unittest discover -s tests

      - name: Run Monitor
        id: monitor
        env:
          PYTHONUNBUFFERED: "1"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_MODE: ${{ github.event.inputs.mode }}
          UN_PRESS_BROWSER_MODE: headless
        run: |
          MODE="${WORKFLOW_MODE:-monitor}"
          if [ "$MODE" = "test_slack" ]; then
            python -m src.main --test-slack
          elif [ "$MODE" = "backfill" ]; then
            python -m src.main --backfill
          elif [ "$MODE" = "dry_run" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      - name: Commit State Changes
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') && github.event.inputs.mode != 'test_slack' && github.event.inputs.mode != 'dry_run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update monitored UN items"
          git push
